<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f1e" />
  <title>塔防游戏</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="game-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div id="hud-stats">
          <span class="hud-stat is-gold" id="hud-gold" title="金币">
            <svg class="hud-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd24a" stroke="#a87800" stroke-width="1.6"/><circle cx="12" cy="12" r="4.8" fill="none" stroke="#a87800" stroke-width="1.3"/><path d="M12 7.2 L13.3 10.6 L16.9 10.6 L13.9 12.9 L15.1 16.4 L12 14.2 L8.9 16.4 L10.1 12.9 L7.1 10.6 L10.7 10.6 Z" fill="#a87800"/></svg>
            <span class="hud-val">0</span>
          </span>
          <span class="hud-stat is-lives" id="hud-lives" title="基地生命">
            <svg class="hud-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-7.5-10.4C4.5 7.5 7 5 9.5 5c1.7 0 3 .9 3.5 2 .5-1.1 1.8-2 3.5-2 2.5 0 5 2.5 5 5.6 0 5.5-7.5 10.4-7.5 10.4z" fill="#e05555" stroke="#8a2a2a" stroke-width="1.3"/></svg>
            <span class="hud-val">0</span>
          </span>
          <span class="hud-stat is-wave" id="hud-wave" title="波次">
            <svg class="hud-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/><path d="M6 4h12l-2.8 3.6L18 11H6z" fill="#5a8ad0" stroke="#2a4a8a" stroke-width="1.2"/></svg>
            <span class="hud-val">0/0</span>
            <span class="hud-sub"></span>
          </span>
          <span class="hud-stat is-map" id="hud-map" title="地图">
            <svg class="hud-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z" fill="none" stroke="#8a7a5a" stroke-width="1.5"/><path d="M9 3v15M15 6v15" fill="none" stroke="#8a7a5a" stroke-width="1"/></svg>
            <span class="hud-val" id="hud-map-name">--</span>
          </span>
          <span class="hud-stat is-weather hidden" id="hud-weather" title="天气">
            <span class="weather-icon">☀️</span>
            <span class="weather-name">晴朗</span>
            <span class="weather-timer">0s</span>
          </span>
        </div>
        <div id="hud-actions">
          <button id="btn-next-wave">开始下一波</button>
          <div id="ultimate-bar">
            <button id="btn-ult-meteor" class="ult-btn" data-ult="meteor" title="陨石雨（Q）" disabled>
              <span class="ult-icon">☄️</span>
              <span class="ult-energy-bar"><span class="ult-energy-fill"></span></span>
            </button>
            <button id="btn-ult-freeze" class="ult-btn" data-ult="freeze" title="全图冰冻（W）" disabled>
              <span class="ult-icon">❄️</span>
              <span class="ult-energy-bar"><span class="ult-energy-fill"></span></span>
            </button>
            <button id="btn-ult-gold" class="ult-btn" data-ult="gold_rush" title="金币狂暴（E）" disabled>
              <span class="ult-icon">💰</span>
              <span class="ult-energy-bar"><span class="ult-energy-fill"></span></span>
            </button>
          </div>
          <button id="btn-sell" class="sell-btn" aria-pressed="false" title="出售模式：长按士兵出售（移动端）">出售</button>
          <button id="btn-panel" class="panel-toggle" title="切换面板">面板</button>
          <button id="btn-mute" class="mute-btn" aria-pressed="false" title="开关音效">静音</button>
        </div>
      </div>
      <div id="overlay" class="hidden">
        <div class="score-card" id="score-card">
          <div class="score-hero">
            <div class="score-rank-mark" id="score-medal">S</div>
            <h2 class="score-title" id="overlay-title">游戏结束</h2>
            <p class="score-subtitle" id="overlay-sub"></p>
          </div>
          <div class="score-grid">
            <div class="score-item">
              <span class="score-label">波次</span>
              <span class="score-value" id="score-waves">0</span>
            </div>
            <div class="score-item">
              <span class="score-label">金币</span>
              <span class="score-value" id="score-gold">0</span>
            </div>
            <div class="score-item">
              <span class="score-label">基地</span>
              <span class="score-value" id="score-lives">0</span>
            </div>
            <div class="score-item">
              <span class="score-label">塔数</span>
              <span class="score-value" id="score-towers">0</span>
            </div>
          </div>
          <div class="score-grade-section">
            <span class="score-grade-label">综合评分</span>
            <span class="score-grade" id="score-grade">--</span>
          </div>
          <div class="score-map-info">
            <span class="score-map-label">地图</span>
            <span class="score-map-name" id="score-map">--</span>
          </div>
          <div class="score-actions">
            <button id="btn-share" class="btn-share">复制战绩</button>
            <button id="btn-restart" class="btn-restart">再来一局</button>
          </div>
        </div>
      </div>
    </div>

    <div id="quiz-overlay" class="hidden" aria-hidden="true">
      <div class="quiz-card" role="dialog" aria-label="升级答题">
        <div class="quiz-head">
          <span class="quiz-title">答题升级</span>
          <span class="quiz-timer" id="quiz-timer">0s</span>
        </div>
        <p class="quiz-upgrade-label" id="quiz-upgrade-label"></p>
        <p class="quiz-question" id="quiz-question">题干…</p>
        <div class="quiz-options" id="quiz-options"></div>
        <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>
      </div>
    </div>

    <aside id="side-panel">
      <div class="panel-section upgrade-panel">
        <h3>全局强化</h3>
        <p class="panel-caption">作用于全部已部署与后续士兵</p>
        <button class="up-btn" data-up="damage"></button>
        <button class="up-btn" data-up="fireRate"></button>
        <button class="up-btn" data-up="range"></button>
      </div>

      <div class="panel-section">
        <h3>武器选择</h3>
        <p class="panel-caption">点击卡片选择，1-7 快捷切换</p>
        <div class="weapon-grid" id="weapon-grid"></div>
        <button id="btn-unlock-magic">解锁魔法塔 · 120金</button>
        <p id="weapon-desc" class="hint"></p>
      </div>

      <div class="panel-section tip">
        <h3>操作说明</h3>
        <p>点击空地放置当前武器士兵</p>
        <p>右键点击士兵出售（返还 50% 金币）</p>
        <p>移动端：长按士兵出售</p>
        <p>1/2/3/4/5/6/7 切换武器</p>
        <p>击杀怪兽得金币，漏怪扣基地血</p>
        <p>打满全部波次即胜利</p>
      </div>
    </aside>

    <!-- 移动端底部操作栏 -->
    <div id="mobile-bar" class="mobile-bar">
      <div class="mobile-weapon-bar" id="mobile-weapon-bar"></div>
      <div class="mobile-action-bar">
        <button id="btn-ult-meteor-m" class="mb-btn mb-ult" data-ult="meteor" title="陨石雨" disabled>☄️</button>
        <button id="btn-ult-freeze-m" class="mb-btn mb-ult" data-ult="freeze" title="冰冻" disabled>❄️</button>
        <button id="btn-ult-gold-m" class="mb-btn mb-ult" data-ult="gold_rush" title="金币" disabled>💰</button>
        <button id="btn-next-wave-m" class="mb-btn mb-wave">开始</button>
        <button id="btn-sell-m" class="mb-btn mb-sell">出售</button>
        <button id="btn-panel-m" class="mb-btn mb-panel">升级</button>
        <button id="btn-mute-m" class="mb-btn mb-mute">🔊</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
