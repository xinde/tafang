<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 装甲怪兽：蓝灰本体 + 装甲板 + 铆钉 + 护甲（每次受击减伤） -->
  <ellipse cx="50" cy="55" rx="34" ry="30" fill="#5a8ad0" stroke="#2a4a8a" stroke-width="3"/>
  <!-- 胸甲板 -->
  <path d="M 20 50 Q 50 30 80 50 L 80 60 Q 50 42 20 60 Z" fill="#7aa0d8" stroke="#2a4a8a" stroke-width="2"/>
  <!-- 肩甲 -->
  <ellipse cx="24" cy="48" rx="8" ry="6" fill="#3a6ab0" stroke="#2a4a8a" stroke-width="2"/>
  <ellipse cx="76" cy="48" rx="8" ry="6" fill="#3a6ab0" stroke="#2a4a8a" stroke-width="2"/>
  <!-- 铆钉 -->
  <circle cx="34" cy="54" r="2.5" fill="#cfd8e8"/>
  <circle cx="50" cy="50" r="2.5" fill="#cfd8e8"/>
  <circle cx="66" cy="54" r="2.5" fill="#cfd8e8"/>
  <!-- 眼缝 -->
  <rect x="36" y="62" width="10" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="54" y="62" width="10" height="4" rx="1" fill="#1a1a1a"/>
  <!-- 角 -->
  <polygon points="30,30 26,16 40,28" fill="#2a4a8a"/>
  <polygon points="70,30 74,16 60,28" fill="#2a4a8a"/>
</svg>
