<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 法师怪：紫袍法师 + 悬浮魔珠，远程攻击型 -->
  <!-- 袍身 -->
  <path d="M 24 78 Q 22 52 32 40 Q 50 26 68 40 Q 78 52 76 78 Z" fill="#b46ae8" stroke="#4a1a6a" stroke-width="3"/>
  <!-- 兜帽 -->
  <path d="M 32 40 Q 50 18 68 40 Q 56 32 50 32 Q 44 32 32 40 Z" fill="#6a2ab0" stroke="#4a1a6a" stroke-width="3"/>
  <!-- 发光的眼 -->
  <ellipse cx="44" cy="48" rx="6" ry="5" fill="#ffdd2a"/>
  <ellipse cx="56" cy="48" rx="6" ry="5" fill="#ffdd2a"/>
  <circle cx="45" cy="49" r="2.6" fill="#1a1a1a"/>
  <circle cx="55" cy="49" r="2.6" fill="#1a1a1a"/>
  <!-- 悬浮魔珠 + 星光 -->
  <circle cx="50" cy="12" r="7" fill="#d99fff" stroke="#4a1a6a" stroke-width="2"/>
  <circle cx="50" cy="12" r="3" fill="#fff"/>
  <polygon points="50,0 52,6 58,6 53,9 56,14 50,11 44,14 47,9 42,6 48,6" fill="#ffdd2a"/>
  <!-- 双手（托举施法姿态） -->
  <circle cx="34" cy="60" r="6" fill="#b46ae8" stroke="#4a1a6a" stroke-width="2"/>
  <circle cx="66" cy="60" r="6" fill="#b46ae8" stroke="#4a1a6a" stroke-width="2"/>
  <!-- 袍底 -->
  <path d="M 30 78 Q 50 72 70 78" fill="none" stroke="#4a1a6a" stroke-width="3"/>
</svg>
