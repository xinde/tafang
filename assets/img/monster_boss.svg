<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Boss：暗红巨兽 + 巨角 + 背刺 + 怒目，每5波出现一只 -->
  <ellipse cx="50" cy="56" rx="40" ry="34" fill="#b02030" stroke="#5a0a14" stroke-width="4"/>
  <!-- 背刺 -->
  <polygon points="30,30 26,12 38,28" fill="#5a0a14"/>
  <polygon points="50,24 46,6 54,6 50,24" fill="#5a0a14"/>
  <polygon points="70,30 74,12 62,28" fill="#5a0a14"/>
  <!-- 巨角 -->
  <path d="M 22 26 Q 10 8 18 4 Q 26 14 30 28 Z" fill="#3a0a10" stroke="#5a0a14" stroke-width="2"/>
  <path d="M 78 26 Q 90 8 82 4 Q 74 14 70 28 Z" fill="#3a0a10" stroke="#5a0a14" stroke-width="2"/>
  <!-- 眼眶 + 发光眼 -->
  <ellipse cx="38" cy="50" rx="9" ry="7" fill="#2a0a10"/>
  <ellipse cx="62" cy="50" rx="9" ry="7" fill="#2a0a10"/>
  <circle cx="38" cy="50" r="4.5" fill="#ffdd2a"/>
  <circle cx="62" cy="50" r="4.5" fill="#ffdd2a"/>
  <circle cx="38" cy="50" r="2" fill="#1a1a1a"/>
  <circle cx="62" cy="50" r="2" fill="#1a1a1a"/>
  <!-- 獠牙 -->
  <polygon points="40,68 36,80 44,70" fill="#fff"/>
  <polygon points="60,68 64,80 56,70" fill="#fff"/>
  <!-- 嘴 -->
  <path d="M 38 70 Q 50 80 62 70" fill="none" stroke="#2a0a10" stroke-width="3"/>
</svg>
