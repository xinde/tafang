<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 弓箭手怪：金甲弓手 + 长弓，远程攻击型 -->
  <!-- 身体/铠甲 -->
  <path d="M 26 78 Q 24 54 34 42 Q 50 30 66 42 Q 76 54 74 78 Z" fill="#e8b84a" stroke="#6a4a10" stroke-width="3"/>
  <!-- 头盔 -->
  <path d="M 34 42 Q 50 22 66 42 Q 58 34 50 34 Q 42 34 34 42 Z" fill="#c89828" stroke="#6a4a10" stroke-width="3"/>
  <!-- 眼缝 -->
  <rect x="40" y="44" width="8" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="52" y="44" width="8" height="4" rx="1" fill="#1a1a1a"/>
  <!-- 头盔顶饰羽毛 -->
  <path d="M 50 22 L 48 10 L 52 10 Z" fill="#c89828" stroke="#6a4a10" stroke-width="1.5"/>
  <!-- 长弓（斜持身后） -->
  <path d="M 18 28 Q 10 50 18 72" fill="none" stroke="#8a5a20" stroke-width="3.5"/>
  <!-- 弓弦 -->
  <path d="M 18 28 L 30 50 L 18 72" fill="none" stroke="#d0d0d0" stroke-width="1.5"/>
  <!-- 箭（搭弦待发） -->
  <line x1="30" y1="50" x2="80" y2="50" stroke="#c89828" stroke-width="2.5"/>
  <!-- 箭头 -->
  <polygon points="80,50 72,45 72,55" fill="#e0d0a0" stroke="#6a4a10" stroke-width="1.5"/>
  <!-- 箭尾羽 -->
  <polygon points="30,50 36,46 36,54" fill="#d0d0d0"/>
  <!-- 持弓手 -->
  <circle cx="30" cy="50" r="5.5" fill="#e8b84a" stroke="#6a4a10" stroke-width="2"/>
  <!-- 持箭手 -->
  <circle cx="68" cy="50" r="5.5" fill="#e8b84a" stroke="#6a4a10" stroke-width="2"/>
  <!-- 腰带 -->
  <path d="M 28 64 Q 50 60 72 64" fill="none" stroke="#6a4a10" stroke-width="3"/>
  <!-- 靴底 -->
  <path d="M 30 78 Q 50 72 70 78" fill="none" stroke="#6a4a10" stroke-width="3"/>
</svg>
